version: '3.8'

services:
  streamlit-dashboard:
    build: .
    container_name: foresight-dashboard
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./app:/app/app
      - ./src:/app/src
    environment:
      - PYTHONUNBUFFERED=1
    command: python -m streamlit run app/streamlit_app.py --server.address=0.0.0.0 --server.port=8501
    restart: unless-stopped

  fastapi-service:
    build: .
    container_name: foresight-api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./service:/app/service
      - ./src:/app/src
    environment:
      - PYTHONUNBUFFERED=1
    command: uvicorn service.api:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

volumes:
  data:
