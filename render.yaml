services:
  - type: web
    name: foresight-dashboard
    env: docker
    plan: free
    dockerContext: .
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: STREAMLIT_SERVER_PORT
        value: 8501
      - key: STREAMLIT_SERVER_ADDRESS
        value: 0.0.0.0
      - key: PYTHONUNBUFFERED
        value: "1"
    command: python -m streamlit run app/streamlit_app.py --server.address=0.0.0.0 --server.port=$PORT
